; Recorder firmware (Guition JC4880P443C_I_W_Y: ESP32-P4 + ESP32-C6).
; To build outside the project folder, set PLATFORMIO_WORKSPACE_DIR.

[platformio]
default_envs = esp32p4

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = espidf

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

; Embedded languages (i18n component): Portuguese and English.
board_build.embed_txtfiles =
    lang/pt.json
    lang/en.json

; Wi-Fi chip (ESP32-C6) firmware, embedded so the device can update it.
board_build.embed_files =
    c6/network_adapter_esp32c6.bin
